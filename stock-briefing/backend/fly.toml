# Fly.io 배포 예시.  fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly secrets set ANTHROPIC_API_KEY=... API_TOKEN=... && fly deploy
app = "stock-briefing"
primary_region = "nrt"   # 도쿄 (한국에서 가장 가까움)

[build]

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  TZ = "Asia/Seoul"
  DATABASE_URL = "/app/data/app.db"

[mounts]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false    # 스케줄러가 돌아야 하므로 항상 켜 둔다
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "60s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
